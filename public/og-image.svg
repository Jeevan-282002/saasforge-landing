<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#060911" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="700" cy="200" r="450" fill="url(#glow)" />

  <!-- Top Badge -->
  <g transform="translate(100, 80)">
    <rect width="320" height="38" rx="19" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10B981" />
    <text x="36" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">REUSABLE DJANGO SAAS ARCHITECTURE</text>
  </g>

  <!-- Product Brand Header -->
  <g transform="translate(100, 150)">
    <path d="M0 8L18 0L36 8V24L18 32L0 24V8Z" stroke="url(#brandGradient)" stroke-width="3" fill="rgba(16, 185, 129, 0.15)" />
    <path d="M18 0V16M36 8L18 16M0 8L18 16" stroke="url(#brandGradient)" stroke-width="2" />
    <text x="48" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">Django SaaS Foundation</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    Build Your SaaS Product.
  </text>
  <text x="100" y="335" fill="url(#brandGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    Not Your SaaS Infrastructure.
  </text>

  <!-- Subheadline -->
  <text x="100" y="400" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400">
    Multi-Tenancy · Database Isolation · 4-Tier RBAC · Audit Logs · Quotas · Celery Outbox
  </text>

  <!-- Feature Chips / Verification Bar -->
  <g transform="translate(100, 480)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="220" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="20" y="32" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">✓ 152 Tests Passed</text>
    
    <!-- Chip 2 -->
    <rect x="235" y="0" width="250" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="255" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Database-per-Tenant</text>

    <!-- Chip 3 -->
    <rect x="500" y="0" width="230" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="520" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">PostgreSQL 17 + Redis</text>

    <!-- Chip 4 -->
    <rect x="745" y="0" width="250" height="52" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="765" y="32" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Celery + Transactional Outbox</text>
  </g>
</svg>

