services:
  - type: web
    name: saasforge-landing
    runtime: static
    buildCommand: pnpm build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: PUBLIC_TALLY_FORM_URL
        value: https://tally.so/r/laBxAB
      - key: PUBLIC_TALLY_EMBED_URL
        value: https://tally.so/embed/laBxAB

