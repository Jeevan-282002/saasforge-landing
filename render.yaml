services:
  - type: web
    name: saasforge-landing
    runtime: node
    buildCommand: pnpm build
    startCommand: node ./dist/server/entry.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
